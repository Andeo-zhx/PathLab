<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathLab</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
        background: transparent;
        color: #1d2928;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
        padding: 14px;
      }

      .card {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 28px;
        background:
          radial-gradient(ellipse at 50% -25%, rgba(112, 180, 169, 0.17), transparent 63%),
          linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(247, 251, 250, 0.93));
        box-shadow: 0 18px 55px rgba(28, 54, 51, 0.16), inset 0 1px rgba(255, 255, 255, 0.95);
        animation: card-arrive 460ms cubic-bezier(.2,.75,.25,1) both;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: -8px;
      }

      .mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(45, 112, 105, 0.12);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 8px 20px rgba(39, 96, 89, 0.1);
      }

      .mark img {
        width: 54px;
        height: 54px;
        object-fit: contain;
      }

      .wordmark {
        margin: 0;
        color: #225f59;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 33px;
        font-style: italic;
        font-weight: 600;
        letter-spacing: -1.7px;
      }

      .subtitle {
        margin: 13px 0 0;
        color: #778480;
        font-size: 13px;
        letter-spacing: 0.14em;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 27px;
        color: #63736f;
        font-size: 12px;
        letter-spacing: 0.05em;
      }

      .dots { display: flex; gap: 4px; }
      .dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #397c74;
        animation: pulse 950ms ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 140ms; }
      .dots span:nth-child(3) { animation-delay: 280ms; }

      @keyframes card-arrive {
        from { opacity: 0; transform: translateY(5px) scale(.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes pulse {
        0%, 70%, 100% { opacity: .28; transform: translateY(0); }
        35% { opacity: 1; transform: translateY(-3px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="PathLab 正在启动">
      <div class="brand">
        <div class="mark"><img src="../dist/pathlab-eye-logo.png" alt="PathLab" /></div>
        <h1 class="wordmark">PathLab</h1>
      </div>
      <p class="subtitle">病理图像观察与标注工作台</p>
      <div class="loading" role="status" aria-live="polite">
        <span>正在准备工作台</span>
        <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </div>
    </main>
  </body>
</html>
